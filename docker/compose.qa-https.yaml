services:
  app:
    environment:
      PUBLIC_ORIGIN: https://localhost:18848
  qa-proxy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:18848:8443"]
    volumes:
      - ./docker/Caddyfile.qa:/etc/caddy/Caddyfile:ro
    depends_on:
      app: {condition: service_healthy}
    tmpfs: [/data, /config]
